<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProBusca - Inteligência Cadastral B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-blue-400">ProBusca <span class="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/30">B2B SaaS</span></h1>
            <span class="text-xs text-slate-400">Consulta de Dados Públicos</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl w-full mx-auto p-6 flex-grow">

        </div>

        <!-- Abas de Seleção -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button type="button" onclick="mudarTipo('cnpj')" id="btn-cnpj" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30">Consultar CNPJ</button>
            <button type="button" onclick="mudarTipo('estado')" id="btn-estado" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Buscar por Estado (UF)</button>
            <button type="button" onclick="mudarTipo('cpf')" id="btn-cpf" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Validar CPF</button>
        </div>

            <div id="container-inputs" class="flex flex-col sm:flex-row gap-3">
