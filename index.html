<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProBusca - Inteligência Cadastral B2B</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-blue-400">ProBusca <span class="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/30">B2B SaaS</span></h1>
            <span class="text-xs text-slate-400">Consulta de Dados Públicos</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl w-full mx-auto p-6 flex-grow">
        <div class="text-center my-8">
            <h2 class="text-3xl font-extrabold mb-2 text-white">Consulta Cadastral Instantânea</h2>
            <p class="text-slate-400 text-sm">Pesquise empresas por CNPJ, Razão Social ou valide a situação cadastral de CPFs.</p>
        </div>

        <!-- Abas de Seleção -->
        <div class="flex justify-center gap-2 mb-6">
            <button onclick="mudarTipo('cnpj')" id="btn-cnpj" class="px-5 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30">Consultar CNPJ</button>
            <button onclick="mudarTipo('nome')" id="btn-nome" class="px-5 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Empresa por Nome</button>
            <button onclick="mudarTipo('cpf')" id="btn-cpf" class="px-5 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Validar CPF</button>
        </div>

        <!-- Caixa de Pesquisa -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="input-termo" placeholder="Digite o CNPJ (ex: 33.000.167/0001-01)" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                <button onclick="realizarBusca()" id="btn-buscar" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center">
                    Pesquisar
                </button>
            </div>
        </div>

        <!-- Área de Carregamento (Spinner) -->
        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm mt-3">Consultando bases de dados oficiais...</p>
        </div>

        <!-- Área de Resultados -->
        <div id="resultado" class="mt-8"></div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-800/50 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        ProBusca MVP &copy; 2026 — Desenvolvido com dados públicos e oficiais.
    </footer>

    <!-- Lógica de Frontend -->
    <script>
        let tipoAtual = 'cnpj';

        function mudarTipo(tipo) {
            tipoAtual = tipo;
            document.getElementById('btn-cnpj').className = tipo === 'cnpj' ? 'px-5 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'px-5 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700';
            document.getElementById('btn-nome').className = tipo === 'nome' ? 'px-5 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'px-5 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700';
            document.getElementById('btn-cpf').className = tipo === 'cpf' ? 'px-5 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'px-5 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700';

            const input = document.getElementById('input-termo');
            if (tipo === 'cnpj') input.placeholder = 'Digite o CNPJ (ex: 33000167000101)';
            else if (tipo === 'nome') input.placeholder = 'Digite o nome ou razão social da empresa';
            else if (tipo === 'cpf') input.placeholder = 'Digite os 11 números do CPF';
            input.value = '';
            document.getElementById('resultado').innerHTML = '';
        }

        async function realizarBusca() {
            const termo = document.getElementById('input-termo').value.trim();
            const resultadoDiv = document.getElementById('resultado');
            const loadingDiv = document.getElementById('loading');

            if (!termo) {
                alert('Por favor, digite um valor para pesquisar.');
                return;
            }

            resultadoDiv.innerHTML = '';
            loadingDiv.classList.remove('hidden');

            let url = '';
            if (tipoAtual === 'cnpj') url = `/api/cnpj/${termo}`;
            else if (tipoAtual === 'nome') url = `/api/nome/${encodeURIComponent(termo)}`;
            else if (tipoAtual === 'cpf') url = `/api/cpf/${termo}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                loadingDiv.classList.add('hidden');

                if (!response.ok) {
                    resultadoDiv.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-center">${data.error || 'Erro ao realizar a consulta.'}</div>`;
                    return;
                }

                // Renderização dinâmica baseada no tipo de retorno
                if (tipoAtual === 'cnpj') {
                    resultadoDiv.innerHTML = `
                        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                            <div class="flex justify-between items-start border-b border-slate-700 pb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-white">${data.razao_social || 'N/A'}</h3>
                                    <p class="text-sm text-slate-400">${data.nome_fantasia ? 'Fantasia: ' + data.nome_fantasia : ''}</p>
                                </div>
                                <span class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/30">${data.descricao_situacao_cadastral || 'Atativa'}</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div><strong class="text-slate-400">CNPJ:</strong> ${data.cnpj}</div>
                                <div><strong class="text-slate-400">Abertura:</strong> ${data.data_inicio_atividade || 'N/A'}</div>
                                <div><strong class="text-slate-400">Porte:</strong> ${data.porte || 'N/A'}</div>
                                <div><strong class="text-slate-400">Natureza Jurídica:</strong> ${data.natureza_juridica || 'N/A'}</div>
                                <div class="md:col-span-2"><strong class="text-slate-400">Endereço:</strong> ${data.tipo_logradouro || ''} ${data.logradouro || ''}, ${data.numero || ''} - ${data.bairro || ''}, ${data.municipio || ''}/${data.uf || ''} (${data.cep || ''})</div>
                            </div>
                        </div>
                    `;
                } else if (tipoAtual === 'cpf') {
                    resultadoDiv.innerHTML = `
                        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                            <div class="flex justify-between items-start border-b border-slate-700 pb-4">
                                <h3 class="text-lg font-bold text-white">Resultado da Validação de CPF</h3>
                                <span class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/30">Válido</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div><strong class="text-slate-400">CPF:</strong> ${data.cpf}</div>
                                <div><strong class="text-slate-400">Situação Válida:</strong> ${data.isValid ? 'Sim' : 'Não'}</div>
                                <div><strong class="text-slate-400">Região Fiscal (RF):</strong> ${data.rf || 'N/A'}</div>
                                <div><strong class="text-slate-400">UFs Associadas:</strong> ${data.ufs ? data.ufs.join(', ') : 'N/A'}</div>
                            </div>
                        </div>
                    `;
                } else if (tipoAtual === 'nome') {
                    // Se for busca por nome, o retorno costuma ser uma lista
                    let empresas = Array.isArray(data) ? data : (data.empresas || [data]);
                    let htmlList = empresas.map(emp => `
                        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl mb-3 hover:border-blue-500/50 transition">
                            <h4 class="font-bold text-white">${emp.razao_social || emp.nome || 'Empresa'}</h4>
                            <p class="text-xs text-slate-400 mt-1">CNPJ: ${emp.cnpj || 'N/A'}</p>
                        </div>
                    `).join('');

                    resultadoDiv.innerHTML = `<div class="space-y-3"><h3 class="text-sm font-semibold text-slate-400 mb-2">Empresas Encontradas:</h3>${htmlList}</div>`;
                }

            } catch (err) {
                loadingDiv.classList.add('hidden');
                resultadoDiv.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-center">Erro de conexão com o servidor.</div>`;
            }
        }
    </script>
</body>
</html>
