<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProBusca - Inteligência Cadastral B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-blue-400">ProBusca <span class="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/30">B2B SaaS</span></h1>
            <span class="text-xs text-slate-400">Consulta de Dados Públicos</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl w-full mx-auto p-6 flex-grow">
        <div class="text-center my-8">
            <h2 class="text-3xl font-extrabold mb-2 text-white">Consulta Cadastral Instantânea</h2>
            <p class="text-slate-400 text-sm">Pesquise por CNPJ, filtre empresas por Estado (UF) ou valide CPFs.</p>
        </div>

        <!-- Abas de Seleção -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button type="button" onclick="mudarTipo('cnpj')" id="btn-cnpj" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30">Consultar CNPJ</button>
            <button type="button" onclick="mudarTipo('estado')" id="btn-estado" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Buscar por Estado (UF)</button>
            <button type="button" onclick="mudarTipo('cpf')" id="btn-cpf" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Validar CPF</button>
        </div>

        <!-- Caixa de Pesquisa Dinâmica -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div id="container-inputs" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="input-termo" placeholder="Digite o CNPJ (ex: 33000167000101)" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                <button type="button" onclick="realizarBusca()" id="btn-buscar" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center">
                    Pesquisar
                </button>
            </div>
        </div>

        <!-- Área de Carregamento -->
        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm mt-3">Consultando bases de dados oficiais...</p>
        </div>

        <!-- Área de Resultados -->
        <div id="resultado" class="mt-8"></div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-800/50 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        ProBusca MVP &copy; 2026 — Desenvolvido com dados públicos e oficiais.
    </footer>

    <!-- Lógica de Frontend -->
    <script>
        let tipoAtual = 'cnpj';

        function mudarTipo(tipo) {
            tipoAtual = tipo;
            
            // Atualiza o estilo visual dos botões das abas
            document.getElementById('btn-cnpj').className = tipo === 'cnpj' ? 'px-4 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700';
            document.getElementById('btn-estado').className = tipo === 'estado' ? 'px-4 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700';
            document.getElementById('btn-cpf').className = tipo === 'cpf' ? 'px-4 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700';

            const container = document.getElementById('container-inputs');
            
            if (tipo === 'cnpj') {
                container.innerHTML = `
                    <input type="text" id="input-termo" placeholder="Digite o CNPJ (ex: 33000167000101)" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                    <button type="button" onclick="realizarBusca()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Pesquisar</button>
                `;
            } else if (tipo === 'estado') {
                container.innerHTML = `
                    <select id="input-uf" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition w-36">
                        <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG" selected>MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                    </select>
                    <input type="text" id="input-termo-estado" placeholder="Filtrar por nome/termo (opcional)" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                    <button type="button" onclick="realizarBusca()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Listar</button>
                `;
            } else if (tipo === 'cpf') {
                container.innerHTML = `
                    <input type="text" id="input-termo" placeholder="Digite os 11 números do CPF" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                    <button type="button" onclick="realizarBusca()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Validar</button>
                `;
            }
            document.getElementById('resultado').innerHTML = '';
        }

        async function realizarBusca() {
            const resultadoDiv = document.getElementById('resultado');
            const loadingDiv = document.getElementById('loading');
            let url = '';

            if (tipoAtual === 'cnpj') {
                const termo = document.getElementById('input-termo').value.trim();
                if (!termo) { alert('Digite um CNPJ'); return; }
                url = `/api/cnpj/${termo}`;
            } else if (tipoAtual === 'estado') {
                const ufElement = document.getElementById('input-uf');
                const termoElement = document.getElementById('input-termo-estado');
                const uf = ufElement ? ufElement.value : 'MG';
                const termo = termoElement ? termoElement.value.trim() : '';
                url = `/api/estado/${uf}?termo=${encodeURIComponent(termo)}`;
            } else if (tipoAtual === 'cpf') {
                const termo = document.getElementById('input-termo').value.trim();
                if (!termo) { alert('Digite um CPF'); return; }
                url = `/api/cpf/${termo}`;
            }

            resultadoDiv.innerHTML = '';
            loadingDiv.classList.remove('hidden');

            try {
                const response = await fetch(url);
                const data = await response.json();
                loadingDiv.classList.add('hidden');

                if (!response.ok) {
                    resultadoDiv.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-center">${data.error || 'Erro ao consultar.'}</div>`;
                    return;
                }

                if (tipoAtual === 'cnpj') {
                    resultadoDiv.innerHTML = `
                        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                            <div class="flex justify-between items-start border-b border-slate-700 pb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-white">${data.razao_social || 'N/A'}</h3>
                                    <p class="text-sm text-slate-400">${data.nome_fantasia ? 'Fantasia: ' + data.nome_fantasia : ''}</p>
                                </div>
                                <span class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/30">${data.descricao_situacao_cadastral || 'Atativa'}</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div><strong class="text-slate-400">CNPJ:</strong> ${data.cnpj}</div>
                                <div><strong class="text-slate-400">Abertura:</strong> ${data.data_inicio_atividade || 'N/A'}</div>
                                <div><strong class="text-slate-400">Porte:</strong> ${data.porte || 'N/A'}</div>
                                <div><strong class="text-slate-400">Telefone:</strong> ${data.ddd_telefone_1 ? '(' + data.ddd_telefone_1 + ') ' + data.telefone_1 : 'N/A'}</div>
                                <div class="md:col-span-2"><strong class="text-slate-400">Endereço:</strong> ${data.tipo_logradouro || ''} ${data.logradouro || ''}, ${data.numero || ''} - ${data.bairro || ''}, ${data.municipio || ''}/${data.uf || ''} (${data.cep || ''})</div>
                            </div>
                        </div>
                    `;
                } else if (tipoAtual === 'estado') {
                    let empresas = [];
                    if (Array.isArray(data)) {
                        empresas = data;
                    } else if (data.empresas && Array.isArray(data.empresas)) {
                        empresas = data.empresas;
                    } else if (data.razao_social || data.cnpj) {
                        empresas = [data];
                    } else if (data.aviso) {
                        resultadoDiv.innerHTML = `<div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 p-4 rounded-xl text-center text-sm">${data.aviso}</div>`;
                        return;
                    }

                    if (empresas.length === 0) {
                        resultadoDiv.innerHTML = `<div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl text-center text-slate-400">Nenhuma empresa encontrada para este estado ou termo.</div>`;
                        return;
                    }

                    let htmlList = empresas.map(emp => `
                        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl mb-3 hover:border-blue-500/50 transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h4 class="font-bold text-white">${emp.razao_social || emp.nome || 'Empresa'}</h4>
                                <p class="text-xs text-slate-400 mt-1">CNPJ: <span class="text-blue-400 font-mono">${emp.cnpj || 'N/A'}</span></p>
                            </div>
                            <span class="bg-slate-700 text-slate-300 px-3 py-1 rounded-lg text-xs font-mono">${emp.uf || 'UF'}</span>
                        </div>
                    `).join('');

                    resultadoDiv.innerHTML = `<div class="space-y-3"><h3 class="text-sm font-semibold text-slate-400 mb-2">Empresas Encontradas no Estado:</h3>${htmlList}</div>`;
                } else if (tipoAtual === 'cpf') {
                    resultadoDiv.innerHTML = `
                        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                            <div class="flex justify-between items-start border-b border-slate-700 pb-4">
                                <h3 class="text-lg font-bold text-white">Validação de CPF</h3>
                                <span class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/30">Válido</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div><strong class="text-slate-400">CPF:</strong> ${data.cpf}</div>
                                <div><strong class="text-slate-400">Situação Válida:</strong> ${data.isValid ? 'Sim' : 'Não'}</div>
                                <div><strong class="text-slate-400">Região Fiscal (RF):</strong> ${data.rf || 'N/A'}</div>
                                <div><strong class="text-slate-400">UFs Associadas:</strong> ${data.ufs ? data.ufs.join(', ') conflito : 'N/A'}</div>
                            </div>
                        </div>
                    `;
                }

            } catch (err) {
                loadingDiv.classList.add('hidden');
                resultadoDiv.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-center">Erro de conexão com o servidor.</div>`;
            }
        }
    </script>
</body>
</html>
