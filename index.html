<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProBusca - Inteligência Cadastral B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-blue-400">ProBusca <span class="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/30">B2B SaaS</span></h1>
            <span class="text-xs text-slate-400">Consulta de Dados Públicos</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl w-full mx-auto p-6 flex-grow">
        <div class="text-center my-8">
            <h2 class="text-3xl font-extrabold mb-2 text-white">Consulta Cadastral Instantânea</h2>
            <p class="text-slate-400 text-sm">Pesquise por CNPJ, filtre empresas por Estado (UF) ou valide CPFs.</p>
        </div>

        <!-- Abas de Seleção -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="mudarTipo('cnpj')" id="btn-cnpj" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30">Consultar CNPJ</button>
            <button onclick="mudarTipo('estado')" id="btn-estado" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Buscar por Estado (UF)</button>
            <button onclick="mudarTipo('cpf')" id="btn-cpf" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">Validar CPF</button>
        </div>

        <!-- Caixa de Pesquisa Dinâmica -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div id="container-inputs" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="input-termo" placeholder="Digite o CNPJ (ex: 33000167000101)" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                <button onclick="realizarBusca()" id="btn-buscar" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center">
                    Pesquisar
                </button>
            </div>
        </div>

        <!-- Área de Carregamento -->
        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm mt-3">Consultando bases de dados oficiais...</p>
        </div>

        <!-- Área de Resultados -->
        <div id="resultado" class="mt-8"></div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-800/50 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        ProBusca MVP &copy; 2026 — Desenvolvido com dados públicos e oficiais.
    </footer>

    <!-- Lógica de Frontend -->
    <script>
        let tipoAtual = 'cnpj';

        function mudarTipo(tipo) {
            tipoAtual = tipo;
            
            // Remove o destaque de todos os botões e aplica apenas no selecionado
            ['cnpj', 'estado', 'cpf'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === tipo) {
                    btn.className = "px-4 py-2 rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                } else {
                    btn.className = "px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700";
                }
            });

            const container = document.getElementById('container-inputs');
            
            if (tipo === 'cnpj') {
                container.innerHTML = `
                    <input type="text" id="input-termo" placeholder="Digite o CNPJ (ex: 33000167000101)" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                    <button onclick="realizarBusca()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Pesquisar</button>
                `;
            } else if (tipo === 'estado') {
                container.innerHTML = `
                    <select id="input-uf" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition w-36">
                        <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG" selected>MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                    </select>
                    <input type="text" id="input-termo" placeholder="Filtrar por nome/termo (opcional)" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                    <button onclick="realizarBusca()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Listar</button>
                `;
            } else if (tipo === 'cpf') {
                container.innerHTML = `
                    <input type="text" id="input-termo" placeholder="Digite os 11 números do CPF" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition">
                    <button onclick="realizarBusca()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Validar</button>
                `;
            }
            document.getElementById('resultado').innerHTML = '';
        }

        async function realizarBusca() {
            const resultadoDiv = document.getElementById('resultado');
            const loadingDiv = document.getElementById('loading');
            let url = '';
